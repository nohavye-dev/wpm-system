[project]
name = "wpm-mcp-server"
version = "0.1.0"
description = "Confidence-weighted, vector+graph hybrid persistent memory MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.9.4",
    "sqlite-vec>=0.1.9",
    "onnxruntime>=1.14.0",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.20.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
wpm = "wpm_mcp_server.cli.main:main"
wpm-mcp-server = "wpm_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E402"]  # imports after sys.path hacks in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]
