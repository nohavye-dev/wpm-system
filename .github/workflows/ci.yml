name: CI

on:
  push:
    branches: [main, main-dev]
  pull_request:
    branches: [main, main-dev]

jobs:
  python:
    name: python (pytest + schema + checksums)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install wpm-mcp-server
        run: pip install -e ./wpm-mcp-server
      - name: Run pytest
        run: pytest wpm-mcp-server --tb=short
        env:
          WPM_SKIP_ONNX_TEST: "1"
      - name: Check generated schema is up to date
        run: python scripts/generate_config_schema.py --check
      - name: Verify SHA256SUMS
        run: sha256sum -c SHA256SUMS --status

  plugin:
    name: plugin (bun typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wpm-opencode-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Lint (Biome)
        # Non-blocking until codebase is formatted to Biome (see Étape 2)
        run: bun run lint || echo "::warning::Biome found issues — will be fixed in Étape 2"
