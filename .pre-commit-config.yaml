repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-format

  - repo: local
    hooks:
      - id: wpm-schema-check
        name: wpm schema up to date
        entry: python scripts/generate_config_schema.py --check
        language: system
        pass_filenames: false
      - id: wpm-checksums
        name: SHA256SUMS valid
        entry: bash -c 'sha256sum -c SHA256SUMS --status'
        language: system
        pass_filenames: false
